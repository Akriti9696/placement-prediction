<!DOCTYPE html>
<html>
<head>
    <title>Placement Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="container">

<h1>Placement Prediction System</h1>

<form action="/predict" method="POST">

    <label>CGPA</label><br>
    <input type="number" 
    step="0.1" 
    name="cgpa" 
    min="0"
    max="10"
    placeholder="Enter CGPA(0-10)"
    required><br><br>

    <label>Programming Score</label><br>
    <input type="number" 
    name="programming"
    placeholder="Enter programming Score(0-100)"
    required><br><br>

    <label>Aptitude Score</label><br>
    <input type="number"
     name="aptitude" 
     placeholder="Enter Aptitude Score (0-100)"
     required><br><br>

    <label>Communication Score</label><br>
    <input type="number" 
    name="communication" 
    placeholder="Enter Communication Score(0-100)"
    required><br><br>

    <label>Projects</label><br>
    <input type="number" 
    name="projects" 
    placeholder="Enter Number of projects(0-10)"
    required><br><br>

    <label>Internship</label>

<select name="internship">

    <option value="1">Yes</option>

    <option value="0">No</option>

</select>

    <button type="submit">Predict</button>

</form>

{% if prediction %}

<div class="result">
    <h3>{{ prediction}}</h3>

    <p>
        Confidence:<strong>{{confidence}}%</strong>
    </p>
    <div class ="progress-bar"
       style="width: {{ confidence }}%;">
         {{confidence}}%
    </div>
</div>
{% endif %}
</div>



</body>
</html>
